<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>template</title>
<script>
   const ua = navigator.userAgent.toLowerCase();
  window.isMobile = /iphone|ipad|android/.test(ua);
  
  if (window.isMobile) {
    document.documentElement.classList.add('mobile');
  }
</script>
<style>
* {margin: 0; padding: 0; box-sizing: border-box;}

:root {
--main_w: 75vw;
--mbar_w: 12vw;
--bgcolor: #2c2f34;
--bars_h: 12vh;
}

[hidden] {display: none !important;}

html, body {
width: 100%;
background-color: var(--bgcolor); 
font-family: sans-serif;
}

#mainWindow {
width: var(--main_w);
min-height: 100vh; 
transform: translateX(calc((100vw - var(--main_w)) / 2));
background-color: red;
display: flex;
flex-direction: column;
}

.horBar {
width: 100%;
height: var(--bars_h);
flex-shrink: 0;
background-color: rgba(0,0,255,.5);
z-index: 9999;
}

#headerPage {
position: sticky;
top: 0;
margin-bottom: 1vh;  
}
#bottomPage {
position: sticky;
bottom: 0;
margin-top: 1vh;
}

#middlePage {
flex-grow: 1;
display: flex;
flex-direction: row;
align-items: stretch; 
}

#elemViewer {
margin-left: 5px;
flex-grow: 1;
display: flex;
flex-direction: column;
}

#iconsColumn {
position: sticky; 
top: calc(var(--bars_h) + 1vh);
height: calc(100vh - var(--bars_h) * 2 - 2vh);
width: var(--mbar_w);
display: flex;
flex-direction: column;
justify-content: flex-end;
margin-left: 5px;
background-color: green;
}

.element {
width: 100%;
margin-bottom: 25px;
background-color: green;
}
.element img {
width: 100%;
height: auto;
display: block;
}
.icon {
aspect-ratio: 1 / 1;
margin-bottom: 5px;
background-color: white;
}
</style>
</head>
<body>

<div id="mainWindow">
    <div class="horBar" id="headerPage"></div>

    <div id="middlePage">
        <div id="elemViewer">
            <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
            <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
            <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
            <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        </div>
        <div id="iconsColumn"> 
            <div class="icon"></div>
            <div class="icon"></div>
        </div>
    </div>

    <div class="horBar" id="bottomPage"></div>
</div>

</body>
</html>
