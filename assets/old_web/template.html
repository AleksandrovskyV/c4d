<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>template</title>
<script>
   const ua = navigator.userAgent.toLowerCase();
  window.isMobile = /iphone|ipad|android/.test(ua);
  
  if (window.isMobile) {
    document.documentElement.classList.add('mobile');
  }
</script>

<style>
* {margin: 0; padding: 0; box-sizing: border-box;}
[hidden] {display: none !important;}
:root {
--bgcolor: #2c2f34;
--bars_h: 12vh;
}

html, body {
width: 100%;height: 100%;
background-color: var(--bgcolor); 
overflow-x: hidden;
font-family: sans-serif;
user-select: text;
touch-action: manipulation;
}

#mainWindow{
height:100%; width:75vw;
background-color: red;
transform: translateX(0%);
}

#middleWindow{
display: flex;
flex-direction: row;
align-items: flex-start; 
}

#elemViewer{
margin-left: 5px;
width: auto;
min-height: 100%;
}

#iconsColumn{
display: flex;
flex-direction: column;
align-items: flex-end;
height: 100%;
min-height: 100%;
margin-left: 5px;
background-color: green;
}

.flex{
display: flex;
flex-direction: column;
align-items: flex-start; 
}

.bar{
width: 100%;
min-height: var(--bars_h);
background-color: rgba(0,0,255,.5);
z-index: 9999;
}
.bar.top{
margin-bottom: 1vh;
}
.bar.bot{
}

.element{
min-width: 100%;
width: auto;
min-height: 1vh;
margin-bottom: 25px;
background-color: green;
z-index: 9000;
}

.element img{
width: 100%;
height: auto;
display: block;
}
.icon{
width: 25px;
height: 25px;
margin-bottom: 5px;
background-color: white;
}

</style>

</head><body>

<div id="mainWindow" class="flex">
    
    <div class="bar top"></div>

    <div id="middleWindow">
        <div id="elemViewer" class="flex">
            <div class="element"> <img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"> </img></div>
            <div class="element"> <img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"> </img></div>
            <div class="element"> <img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"> </img></div>
            <div class="element"> <img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"> </img></div>
        </div>

        <div id="iconsColumn" class="flex"> 
            <div class="icon"></div>
            <div class="icon"></div>
        </div>

    </div>

    <div class="bar bot"></div>
</div>

</body></html>
