name: Deploy GitHub Pages without Jekyll Trash

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Build Clean HTML
        run: |

          # метод замены ".gif" на "mp4", исправление <p> на <div class="mreplace">
          process_html_videos() {
            local input_file="$1"
            local output_file="$2"
            local temp_file="temp_processing.html"
            
            # Копируем исходный HTML во временный файл
            cp "$input_file" "$temp_file"
            
            # Извлекаем все пути к гифкам из тегов <img>
            grep -oP 'src="\K[^"]+\.gif' "$input_file" | sort -u | while read -r gif_path; do
              # Очищаем путь для проверки файлов на диске виртуальной машины
              local clean_path=$(echo "$gif_path" | sed 's|^\./||' | sed 's|^/||')
              
              # Формируем пути к mp4 и jpg на диске
              local mp4_path="${clean_path%.gif}.mp4"
              local jpg_path="${clean_path%.gif}.jpg"
              
              # Формируем пути для тегов в HTML
              local html_mp4_path="${gif_path%.gif}.mp4"
              local html_jpg_path="${gif_path%.gif}.jpg"
              
              # Изначально ставим в постер саму гифку
              local final_poster="$gif_path"
              
              # ПРОВЕРКА 1: Видеофайл .mp4 СТРОГО обязан существовать
              if [ -f "$mp4_path" ]; then
                echo "Найдено видео для автозамены: $mp4_path"
                
                # ПРОВЕРКА 2: Если рядом лежит .jpg, берем его как постер
                if [ -f "$jpg_path" ]; then
                  echo "--> Найдена легкая JPG-заглушка для постера: $jpg_path"
                  final_poster="$html_jpg_path"
                else
                  echo "--> [Предупреждение] JPG не найден, используем исходный GIF в качестве постера: $gif_path"
                fi
                
                # Создаем точный тег видео для замены
                local video_tag="<video autoplay muted loop playsinline poster=\"$final_poster\" ><source src=\"$html_mp4_path\" type=\"video/mp4\"></video>"
                
                # Экранируем спецсимволы для безопасного использования в sed
                local safe_gif_path=$(echo "$gif_path" | sed 's|/|\\/|g' | sed 's|\.|\\.|g')
                local safe_video_tag=$(echo "$video_tag" | sed 's|/|\\/|g')
                
                # 1. Заменяем только этот конкретный тег img на тег video
                sed -i -E "s|<img[^>]+src=\"$safe_gif_path\"[^>]*>|$safe_video_tag|g" "$temp_file"

                # 2. ИСПРАВЛЕНИЕ: Замена родительского <p>...</p> на <div>...</div> с любым внутренним контентом
                # Шаг А: Меняем открывающий <p>, если сразу за ним (или через <span>) идет наше видео
                sed -i -E "s|<p>(([[:space:]]*)(<span>)?$safe_video_tag)|<div class=\"mreplace\">\1|g" "$temp_file"
                
                # Шаг Б: Находим закрывающий </p> этой же группы. 
                # Так как sed работает построчно, а pandoc выводит абзац в одну строку, 
                # мы ищем </p>, которому предшествует наше видео и любые символы кроме тегов закрытия других блоков.
                sed -i -E "s|($safe_video_tag.*)</p>|\1</div>|g" "$temp_file"

                
              else
                echo "Видео не найдено, оставляем GIF: $mp4_path"
              fi
            done
            
            # Переносим обработанный результат в чистовой файл и удаляем временный
            mv "$temp_file" "$output_file"
          }



          # -----------------------------------------------------------------
          # 1. Создание mainpage ("index.html") из корневого README.md
          # -----------------------------------------------------------------
          echo '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8">' > index.html
          echo '<meta name="viewport" content="width=device-width, initial-scale=1">' >> index.html
          echo '<title>/c4d</title>' >> index.html
          echo '<meta name="description" content="Scripts & Projects for Cinema 4D">' >> index.html
          echo '<meta property="og:title" content="/c4d">' >> index.html
          echo '<meta property="og:description" content="Scripts & Projects for Cinema 4D">' >> index.html
          
          # Замораживаем базовый путь для картинок и ссылок, чтобы они не ломались
          echo '<base href="/c4d/">' >> index.html

          # ИСПРАВЛЕНО: Обернуто в {} для главного index.html
          echo '<script>{let p=location.pathname; if(p.endsWith(".html"))p=p.slice(0,-5); if(p.endsWith("index"))p=p.slice(0,-5); if(p.endsWith("/"))p=p.slice(0,-1); if(p!==location.pathname){history.replaceState(null,"",p+location.search+location.hash);}}</script>' >> index.html

          echo '<style>' >> index.html
          cat ./assets/css/style.css >> index.html
          echo '</style>' >> index.html          

          echo '</head><body><div class="container-lg px-3 my-5 markdown-body">' >> index.html

          # Базовая конвертация в промежуточный файл     
          # Находит имя svg файла и делает из него второй класс: <div class="btnico имя_файла"></div>
          # Замена H1: превращая его в c4d/text
          tr -d '\r' < README.md | pandoc -f markdown-yaml_metadata_block -t html | sed 's/\.md"/\.html"/g' | sed 's/\xF0\x9F\x94\xB9 /<span class="downico"><\/span>/g' | sed -E 's|<img[^>]+src="[^"]*/([^/"]+)\.svg"[^>]*>|<div class="btnico \1"><\/div>|g' | sed -E 's|<h1 id="([^"]+)">([^<]+)</h1>|<h1 id="\1">c4d\/\2</h1>|g' > root_base.html
          
          # Запуск метода проверки видео для корня
          process_html_videos "root_base.html" "root_final.html"
          cat root_final.html >> index.html
          rm root_base.html root_final.html
          
          echo '</div></body></html>' >> index.html

          # -----------------------------------------------------------------
          # 2. Сборка всех .md файлов внутри папки readme
          # -----------------------------------------------------------------
          if [ -d "readme" ]; then
            shopt -s nocaseglob
            
            for file in readme/*.md; do
              [ -e "$file" ] || continue
              
              base_name=$(basename "$file")
              filename="${base_name%.*}"

              if [ "$filename" = "readme" ] || [ "$filename" = "README" ]; then
                html_file="readme/index.html"
                title_name="/c4d/readme"
              elif [ "$filename" = "monolog-mirror-along-edge-loop" ]; then
                html_file="readme/monolog-mirror-along-edge-loop.html"
                title_name="/c4d/monolog"
              else
                html_file="readme/${filename}.html"
                title_name="/c4d/$filename"
              fi
              
              # Проверяем, монолог это или нет
              if [ "$filename" = "monolog-mirror-along-edge-loop" ]; then
                # Вставляем расширенный head для монолога (на русском, с Open Graph и Twitter мета-тегами)
                    echo "<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>$title_name</title><link rel=\"canonical\" href=\"https://vsky.space/c4d/readme/monolog-mirror-along-edge-loop\"><meta property=\"og:title\" content=\"/c4d/monolog\"><meta property=\"og:type\" content=\"website\"><meta property=\"og:url\" content=\"https://vsky.space/c4d/readme/monolog-mirror-along-edge-loop\"><meta property=\"og:description\" content=\"Текстовый процесс появления \&quot;Mirror along Edge Loop\&quot;\"><meta property=\"og:image\" content=\"https://vsky.space/content/cover/monolog_mael.jpg\"><meta property=\"og:image:secure_url\" content=\"https://vsky.space/content/cover/monolog_mael.jpg\"><meta name=\"twitter:card\" content=\"summary_large_image\"><meta name=\"twitter:title\" content=\"/c4d/monolog\"><meta name=\"twitter:description\" content=\"Текстовый процесс появления \&quot;Mirror along Edge Loop\&quot;\"><meta name=\"twitter:image\" content=\"https://vsky.space/content/cover/monolog_mael.jpg\"><meta name=\"twitter:site\" content=\"@AleksandrovskyV\">" > "$html_file"
              else
                # Для всех остальных файлов оставляем дефолтный заголовок на английском
                echo "<!DOCTYPE html><html lang=\"en-US\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>$title_name</title>" > "$html_file"
              fi

              # Мгновенно очищаем URL: убираем .html, затем слово index, затем финальный слэш
              echo '<script>{let p=location.pathname; if(p.endsWith(".html"))p=p.slice(0,-5); if(p.endsWith("index"))p=p.slice(0,-5); if(p.endsWith("/"))p=p.slice(0,-1); if(p!==location.pathname){history.replaceState(null,"",p+location.search+location.hash);}}</script>' >> "$html_file"


              echo '<style>' >> "$html_file"
              cat ./assets/css/style.css >> "$html_file"
              echo '</style>' >> "$html_file"
              echo '</head><body><div class="container-lg px-3 my-5 markdown-body">' >> "$html_file"
              
              # Базовая конвертация внутренней страницы в промежуточный файл
              if [ "$filename" = "readme" ] || [ "$filename" = "README" ]; then
                pandoc -f markdown-yaml_metadata_block -t html "$file" | tr -d '\r' | sed -E 's|href="[^"]*">return</a>|href="index.html">return</a>|g' | sed 's/href="\.\//href="readme\//g' | sed 's/\.md"/\.html"/g' | sed 's/\xF0\x9F\x94\xB9 /<span class="downico"><\/span>/g' | sed -E 's|<img[^>]+src="[^"]*/([^/"]+)\.svg"[^>]*>|<div class="btnico \1"><\/div>|g' > internal_base.html
              else
                # Для всех остальных файлов в папке readme оставляем как было
                pandoc -f markdown-yaml_metadata_block -t html "$file" | tr -d '\r' | sed -E 's|href="[^"]*">return</a>|href="index.html">return</a>|g' | sed 's/\.md"/\.html"/g' | sed 's/\xF0\x9F\x94\xB9 /<span class="downico"><\/span>/g' | sed -E 's|<img[^>]+src="[^"]*/([^/"]+)\.svg"[^>]*>|<div class="btnico \1"><\/div>|g' > internal_base.html
              fi


              # Запуск функции умной проверки видео для внутренних страниц
              process_html_videos "internal_base.html" "internal_final.html"
              cat internal_final.html >> "$html_file"
              rm internal_base.html internal_final.html
              
              echo '</div></body></html>' >> "$html_file"
            done
            
            shopt -u nocaseglob
          fi

          # Создаем точную копию главной страницы, но с именем "c4d" без расширения.
          cp index.html c4d

          # Явно говорим GitHub Pages отдавать этот файл по запросу
          echo -e "filtered_content:\n  - c4d" > _config.yml


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
