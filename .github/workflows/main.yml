name: Deploy GitHub Pages without Jekyll Trash

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Build Clean HTML
        run: |
          # 1. Сборка главного index.html из корневого README.md
          echo '<!DOCTYPE html><html lang="en-US"><head><meta charset="UTF-8">' > index.html
          echo '<title>./c4d</title>' >> index.html
          echo '<meta name="description" content="Scripts & Projects for Cinema 4D">' >> index.html
          echo '<meta property="og:title" content="./c4d">' >> index.html
          echo '<meta property="og:description" content="Scripts & Projects for Cinema 4D">' >> index.html
          echo '<link rel="stylesheet" href="./assets/css/style.css">' >> index.html
          echo '</head><body><div class="container-lg px-3 my-5 markdown-body">' >> index.html
          
          # Улучшенный sed, который 100% заменит .md на .html в ссылках
          pandoc -f markdown -t html README.md | sed -E 's/href="([^"]+)\.md"/href="\1.html"/g' >> index.html
          
          # ИСПРАВЛЕНО: Добавлен закрывающий </div>, чтобы контент не пропадал
          echo '</div></body></html>' >> index.html

          # 2. Сборка всех .md файлов внутри папки readme в формат .html
          if [ -d "readme" ]; then
            find readme -name "*.md" | while read -r file; do
              html_file="${file%.md}.html"
              filename=$(basename "$file" .md)
              
              echo "<!DOCTYPE html><html lang=\"en-US\"><head><meta charset=\"UTF-8\"><title>./c4d/$filename</title><link rel=\"stylesheet\" href=\"../assets/css/style.css\"></head><body><div class=\"container-lg px-3 my-5 markdown-body\">" > "$html_file"
              
              # Улучшенный sed для внутренних страниц
              pandoc -f markdown -t html "$file" | sed -E 's/href="([^"]+)\.md"/href="\1.html"/g' >> "$html_file"
              
              echo '</div></body></html>' >> "$html_file"
            done
          fi



      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
