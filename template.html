<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>template</title>
<script>
   const ua = navigator.userAgent.toLowerCase();
  window.isMobile = /iphone|ipad|android/.test(ua);
  
  if (window.isMobile) {
    document.documentElement.classList.add('mobile');
  }
</script>

<style>
* {margin: 0; padding: 0; box-sizing: border-box;}

:root {
--main_w: 75%;
--sidebar_w: 24vw;
--sidemob_w: 12vw;
--header_h: 12vh;
--footer_h: 12vh;
--spaces: 5px;
--bgcolor: #2c2f34;
}

[hidden] {display: none !important;}

html, body {
width: 100%;
background-color: var(--bgcolor); 
font-family: sans-serif;
overflow-x: hidden;
overflow-y: auto;
}

.linePage {
  position: fixed; 
  left: 0;
  right: 0;
  margin-left: auto;
  margin-right: auto;
  
  width: var(--main_w);
  background-color: red; 
  z-index: 9999; 
}

/* Высота в 2 раза больше, чтобы скрыть контент */
#header { 
top: calc(var(--header_h) * -1);
height: calc(var(--header_h) * 2);
}

#footer { 
bottom: calc(var(--footer_h) * -1);
height: calc(var(--footer_h) * 2);
}

#mainPage {
width: var(--main_w);
margin-left: auto;
margin-right: auto;
transform: translateY(calc(var(--header_h) + var(--spaces)));
display: flex; flex-direction: row;
align-items: flex-start; 
margin-bottom: calc(var(--footer_h) * 2);
}

#ContentViewer {
display: flex; 
flex-direction: column;
flex-grow: 1;
margin: var(--spaces);
min-width: 0; 
}


#iconsColumnFake {
width: var(--sidebar_w);
min-height: 1px;
height: 100%;
background-color: transparent;
flex-shrink: 0; 
background-color: blue;
z-index: 9500;
}

#iconsColumn {
position: fixed; 
top: calc(var(--header_h) + var(--spaces));
right: calc((100% - var(--main_w)) / 2);
width: var(--sidebar_w);
height: calc(100vh - var(--header_h) - var(--footer_h) - var(--spaces) * 2);

display: flex;
flex-direction: column;
justify-content: flex-end;
background-color: green;
}

.element {
width: 100%;
margin-bottom: 25px;
min-width: 0; 
}
.element img {
max-width: 100%;
height: auto;
display: block;
}

.mbtn {
aspect-ratio: 1 / 1;
margin-top: var(--spaces);
background-color: #373c43;
background-size: auto; 
background-repeat: no-repeat;
background-position: center;
}

#fp { background-image: url('./assets/svg/FilledPlane.svg'); }

@media (max-width: 780px) {
    :root {
    --main_w: 97.5%;
    --sidebar_w: 12vw;
    }
}

</style>
</head>
<body>

<div id="header" class="linePage"></div>

<div id="iconsColumn"> 
    <div id ="fp" class="mbtn"></div>
    <div id ="fp" class="mbtn"></div>
    <div id ="fp" class="mbtn"></div>
    <div id ="fp" class="mbtn"></div>
</div>

<div id="mainPage">
    <div id="ContentViewer">
        <div class="element">
            <p>BlaBlaBlas</p>
            <img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png">
        </div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
    </div>
    <div id="iconsColumnFake" ></div>
</div>

<div id="footer" class="linePage"></div>

</div>

<script>
function lerp(start, end, amt) {
    return (1 - amt) * start + amt * end;
}

function resizeGeneral() {
    const width = window.innerWidth;
    const mobile_width = 780+1;

    if (width <= mobile_width) { 
        document.documentElement.style.setProperty('--main_w', '97.5%');
        document.documentElement.style.setProperty('--sidebar_w', `12vw`);

        
    } else if (width >= 1400) {
        document.documentElement.style.setProperty('--main_w', '75%');
        document.documentElement.style.setProperty('--sidebar_w', `24vw`);


    } else {
        const interpolationFactor = (width - mobile_width) / (1400 - mobile_width);
        const calcWidth = lerp(97.5, 75.0, interpolationFactor);
        const calSidebar = lerp(12.0, 24.0, interpolationFactor);

        document.documentElement.style.setProperty('--main_w', `${calcWidth}%`);
        document.documentElement.style.setProperty('--sidebar_w', `${calSidebar}vw`);
    }

}

function firstStart() {
    resizeGeneral();
}

window.onload = firstStart;
window.addEventListener('resize', resizeGeneral);

</script>

</body>
</html>
