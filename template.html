<script>
function lerp(start, end, amt) {
    return (1 - amt) * start + amt * end;
}

const mobileWidth = 780+1;

let nowWidth = window.innerWidth;
let isMobileWidth = nowWidth <= mobileWidth ? true : false;

let translated = false; 
let switchSides = false; 

/// USER INTERFACE - GLOBAL SWAPS

let backupSoloCheck = null;
let shortShelfActive = false;

let gifmobileflag = false;
let isTransitBlocked = false;
let shifting = false;

function soloCheck(state) {
     // Выбор активного элемента на странице

    if(shortShelfActive) return;

    const blocks = document.querySelectorAll('.elementBlock');

    if (blocks.length === 0) return;

    if (state) {
        if (!backupSoloCheck) {
            backupSoloCheck = new Map();
            blocks.forEach(block => {
                backupSoloCheck.set(block, block.hidden);
            });
        }

        const screenCenterY = window.innerHeight / 2;
        let closestBlock = null;
        let minDifference = Infinity;

        blocks.forEach(block => {
            const rect = block.getBoundingClientRect();
            const blockCenterY = rect.top + rect.height / 2;
            const difference = Math.abs(blockCenterY - screenCenterY);

            if (difference < minDifference) {
                minDifference = difference;
                closestBlock = block;
            }
        });

        blocks.forEach(block => {
            if (block === closestBlock) {
                block.hidden = false;
            } else {
                block.hidden = true;
            }
        });
        
        const targetBtnName = closestBlock ? closestBlock.id : null;
        if (targetBtnName) {
            const buttons = document.querySelectorAll('.mt_btn');
            
            buttons.forEach(btn => {
                if (btn.dataset.func === targetBtnName) {
                    btn.classList.add('active');
                    lastCheckedButtons = [btn].filter(Boolean);
                } else {
                    btn.classList.remove('active');
                }
            });
        }

    } else {
        if (backupSoloCheck) {
            blocks.forEach(block => {
                if (backupSoloCheck.has(block)) {
                    block.hidden = backupSoloCheck.get(block);
                }
            });
            backupSoloCheck = null;
        }
    }
}

function transitElements(toContainerSelector, targetSelector) {
    document.querySelectorAll('.elementBlock').forEach(block => {
        const destination = block.querySelector(toContainerSelector);
        const targetElement = block.querySelector(targetSelector);

        if (destination && targetElement) {
            if (!destination.contains(targetElement)) {
                destination.appendChild(targetElement);
            }
        }
    });
}

function transitAllGifs(to_mobile, hard) {
    if (hard){
        isTransitBlocked = false;
    }
    if (isTransitBlocked) return;
    shifting = true;
    document.querySelectorAll('.elementBlock').forEach(block => {
        const webPlaceholder = block.querySelector('.gif_placeholder_web');
        const mobilePlaceholder = block.querySelector('.gif_placeholder_mobile');
        const gifPreview = block.querySelector('.gifpreview');

        const elemChecker = gifPreview && webPlaceholder && mobilePlaceholder;

        if (!elemChecker) return;

        if (to_mobile) {
            mobilePlaceholder.appendChild(gifPreview);
            if (!gifmobileflag) {
                gifmobileflag = true;
            }
        } else {
            webPlaceholder.appendChild(gifPreview);
            if (gifmobileflag) {
                gifmobileflag = false;
            }
        }
    });

    shifting = false;
    isTransitBlocked = true;

    setTimeout(() => {
        isTransitBlocked = false;
    }, 500); 
}

function gifSizeChecker() {
    const gif_align = window.innerWidth<1790;
    transitAllGifs(gif_align, true); 
}

function switchSide() {
    switchSides = !switchSides;
    
    const mainMenu = document.getElementById('mainMenu');
    
    if(mainMenu){
        mainMenu.classList.toggle('swap')
    }
    

    const right = document.getElementById('webTrickbar');
    const rightMobile = document.getElementById('mobileTrickbar');

    const left = document.getElementById('webTrickbarSwap');
    const leftMobile = document.getElementById('mobileTrickbarSwap');

    const width = window.innerWidth;

    if (width < mobile_width && switchSides){
        left.hidden = true;
    }else{
        left.hidden = !switchSides;
    }

    right.hidden = switchSides;
    rightMobile.hidden = switchSides;
    leftMobile.hidden = !switchSides;

    const downPackage = document.getElementById('down_package');
    const viewCode = document.getElementById('viewcode');

    if (downPackage && viewCode) {
        const dummy = downPackage.cloneNode(false);
        downPackage.replaceWith(dummy);
        viewCode.replaceWith(downPackage);
        dummy.replaceWith(viewCode);

        if(switchSides){
            viewCode.classList.remove('rtext');
            downPackage.classList.add('rtext');
        }else{
            viewCode.classList.add('rtext');
            downPackage.classList.remove('rtext');
        }
    }



    renderSwapButtons();
}

function switchToMobile(mobile_state) {
    mobile = mobile_state;
    const hide_flag = mobile ? false : true;
    const unhide_flag = mobile ? true : false;

    const webSidebar =  document.getElementById('webSidebar');
    const webTrickbar =  document.getElementById('webTrickbar');

    if(webSidebar && webTrickbar){
        webSidebar.hidden = unhide_flag;
        webTrickbar.hidden = unhide_flag;

    document.querySelectorAll('.line_struct').forEach(el => el.hidden = hide_flag);
    document.querySelectorAll('.cmark').forEach(el => el.hidden = unhide_flag);

    if(isMobile){
        document.querySelectorAll('.downlink').forEach(el => el.hidden = unhide_flag);
    }
}

function hideOverflowingButtons() {
  const container = document.getElementById('sideShelfMobile');
  const ghost = document.getElementById('ghostOverlap');
  const switchLangMobile = document.getElementById('switchLangMobile');
  
  const activeShelf = container.querySelector('#shelfScripts:not([hidden]), #shelfProject:not([hidden])');
  
  if (!activeShelf) return;

  const buttons = activeShelf.querySelectorAll('.mbtn');

  const containerBottom = container.getBoundingClientRect().bottom;
  const ghostHeight = ghost.offsetHeight;
  const safeHeight = containerBottom - ghostHeight * 0.8;

  let hasHiddenElements = false;
  
  buttons.forEach(btn => {
    btn.hidden = false;
    const btnBottom = btn.getBoundingClientRect().bottom;

    if (btnBottom > safeHeight) {
      btn.hidden = true;
      hasHiddenElements = true; 
    }
  });

  if (hasHiddenElements) {
    switchLangMobile.style.setProperty('margin-top', '0px', 'important');
    ghost.style.setProperty('margin-top', 'auto', 'important');
  } else {
    switchLangMobile.style.removeProperty('margin-top');
    ghost.style.removeProperty('margin-top');
  }
}

/// USER INTERFACE - TEXT AND LANG

/// этот метод лучше полностью перенести на css
function headerTextShorter() {
    const headerPage = document.getElementById('headerPage');

    const pearlLine  = document.getElementById('pearlLine');
    const namepage   = document.getElementById('namepage');
    const usertext   = document.getElementById('usertext');
    const endsection = document.getElementById('scrbtn');

    // Выбираем первый активный utContent внутри namepage
    const namepageText = namepage ? namepage.querySelector('.utContent') : null;
    const lastbtnText  = endsection ? endsection.querySelector('.utContent') : null;

    const nameCases = {
        'namepage': ['C4D', 'CINEMA 4D'], 
        'usertext': ['&','&_DATA','&_USERDATA','VSKY_USERDATA']
    };
        
    const currentIndices = {
        namepage: nameCases.namepage.length - 1,
        usertext: nameCases.usertext.length - 1,
    };

    const reductionOrder = [
        { key: 'namepage' },
        { key: 'usertext' },
    ];

    const updateDOM = () => {
        const nowWidth = window.innerWidth;

        const allRules = (namepageText && usertext && lastbtnText && pearlLine);
        if (!allRules) return;

        if (nowWidth >= 960 && nowWidth < 1300) {
            namepageText.textContent = "C4D";
            usertext.textContent = "&_DATA";
        } else if (nowWidth < 960) {
            namepageText.textContent = "C4D";
            usertext.textContent = "&";
        } else {
            namepageText.textContent = nameCases.namepage[currentIndices.namepage];
            usertext.textContent = "\u00A0" + nameCases.usertext[currentIndices.usertext] + "\u00A0";
        }

        if (namepageText.textContent === "C4D") {
            pearlLine.textContent = "* pearl";
        } else {
            pearlLine.textContent = "* pearl edition";
        }

        const currentMobileWidth = typeof mobileWidth !== 'undefined' ? mobileWidth : 768;

        if (nowWidth < currentMobileWidth * 0.7) {
            lastbtnText.textContent = "SCR" + "\u00A0";
        } else {
            lastbtnText.textContent = "SCRIPTS";
        }
    };
    
  updateDOM();

  if (!headerPage) return;

  const isOverflowing = () => {
    return headerPage.scrollWidth > headerPage.clientWidth;
  };
  
  let step = 0;
  
  while (isOverflowing() && step < reductionOrder.length) {
    const currentTarget = reductionOrder[step];
    
    if (currentIndices[currentTarget.key] > 0) {
      currentIndices[currentTarget.key]--;
      updateDOM();
    } else {
      step++; 
    }
  }
}

function updateResponsiveText() {
    const nowWidth = window.innerWidth;
    const langPrefix = translated ? 'ru' : 'us';

    document.querySelectorAll('.lngsup').forEach(texblock => {
        if (texblock.id === 'swapside' || texblock.id === 'swapside_mobile') return;
        let text = '';
        
        if (nowWidth <= 1000) {
            text = texblock.dataset[`${langPrefix}Short` ] || texblock.dataset[`${langPrefix}Mid`];
        } else if (nowWidth > 1000 && nowWidth <= 1400) {
            text = texblock.dataset[`${langPrefix}Mid`];
        } else if (nowWidth > 1400 && nowWidth <= 1700) {
            text = texblock.dataset[`${langPrefix}Mid` ];
        }

        if (!text) {
            text = texblock.dataset[langPrefix];
        }

        if (text) {
            texblock.textContent = text;
        }
    });
}

function changeMobileDownloadBtn(check) {
    const mob_str_a = document.getElementById('mob_str_a');
    const mob_str_b = document.getElementById('mob_str_b');

    const langPrefix = translated ? 'ru' : 'us';
    const keySuffix = check ? '-p' : ''; 
    const fullAttributeName = `data-${langPrefix}${keySuffix}`;

    mob_str_a.textContent = mob_str_a.getAttribute(fullAttributeName);
    mob_str_b.textContent = mob_str_b.getAttribute(fullAttributeName);
}

function renderSwapButtons() {
    const langPrefix = translated ? 'ru' : 'us'; 
    const attributeName = switchSides ? `${langPrefix}Swap` : langPrefix;

    const swapButton = document.getElementById('swapside');
    const swapMobile = document.getElementById('swapside_mobile');

    if (swapButton && swapButton.dataset[attributeName]) {
        swapButton.textContent = swapButton.dataset[attributeName];
    }
    if (swapMobile && swapMobile.dataset[attributeName]) {
        swapMobile.textContent = swapMobile.dataset[attributeName];
    }
}

function updateShortShelf() {
     // Сверх мелкий грид
    const shelf = document.getElementById('shortshelf');
    if (!shelf) return;

    const width = window.innerWidth;
    const height = window.innerHeight;
    const isMobileLayout = document.documentElement.classList.contains('mobile');

    if (width < 600 && height < 600 && !isMobileLayout) {

        shelf.hidden = false;
        shortShelfActive =true;

        const buttons = shelf.querySelectorAll('.mt_btn');
        const count = buttons.length;

        const cols = Math.ceil(Math.sqrt(count)); 
        shelf.style.setProperty('--cols', cols);

    } else {
        shelf.setAttribute('hidden', '');
        shelf.style.removeProperty('display');
        shelf.hidden = true;
        shortShelfActive =false;
    }
}

function switchLang() {
    translated = !translated;

    if (langButtonMobile) {
        langButtonMobile.textContent = translated ? "US" : "RU";
    }

    document.querySelectorAll('.elementBlock').forEach(block => {
        const us_text = block.querySelector('.about_us');
        const ru_text = block.querySelector('.about_ru');

        if (ru_text && us_text) {
            us_text.hidden = translated ? true : false;
            ru_text.hidden = translated ? false : true;
        }
    });
    document.querySelectorAll('.elementBlock').forEach(block => {
        const us_text = block.querySelector('.about_us_s');
        const ru_text = block.querySelector('.about_ru_s');

        if (ru_text && us_text) {
            us_text.hidden = translated ? true : false;
            ru_text.hidden = translated ? false : true;
        }
    });
    document.querySelectorAll('.elementBlock').forEach(block => {

    document.querySelectorAll('.elementBlock').forEach(block => {

        const ru_text = block.querySelector('.about_с_ru');

        const ru_text_mob = block.querySelector('.about_с_ru_mb');

        if (ru_text && us_text) {
            us_text.hidden = translated ? true : false;

            if(ru_text_mob && isMobile){

                ru_text_mob.hidden = translated ? false : true;
            }else{
                ru_text.hidden = translated ? false : true;                
            }
        }
    });

    document.querySelectorAll('.lngsup').forEach(texblock => {
        if (texblock.id === 'swapside' || texblock.id === 'swapside_mobile') return;
        
        texblock.textContent = translated ? texblock.dataset.ru : texblock.dataset.us;
    });

    updateResponsiveText();
    renderSwapButtons();
}

let lastCheckedMainTabs = []; 
let lastCheckedButtons = []; 
let lastCheckedU = null;
let lastCheckedT = null;

function nextElement() {
    const toolbarPrj = document.getElementById('shelfProject');
    const toolbarScr = document.getElementById('shelfScripts');
    
    function activateNextInContainer(container) {
        if (!container || container.hidden) return;
        
        const buttons = container.querySelectorAll('.clickfunc');
        if (buttons.length === 0) return;

        let activeIndex = -1;
        
        buttons.forEach((btn, index) => {
            if (btn.classList.contains('active')) {
                activeIndex = index;
            }
        });
        
        const nextIndex = (activeIndex + 1) % buttons.length;
        let nextButton = buttons[nextIndex];

        // ПРОВЕРКА: Если следующая кнопка скрыта, крутим карусель
        if (nextButton && nextButton.hidden) {
            const firstButton = buttons[0];
            container.appendChild(firstButton);

            hideOverflowingButtons();

            const updatedButtons = container.querySelectorAll('.clickfunc');
            nextButton = updatedButtons[nextIndex];
        }

        if (nextButton) {
            nextButton.click();
        }
    }

    activateNextInContainer(toolbarPrj);
    activateNextInContainer(toolbarScr);
}

function viewCurrentCode(){
    const currentVisibleBlock = Array.from(document.querySelectorAll('.elementBlock'))
                                     .find(block => !block.hidden);

    if (currentVisibleBlock) {
        const downloadLink = currentVisibleBlock.querySelector('.texlink.dn');
        
        if (downloadLink && downloadLink.href) {
            window.open(downloadLink.href, '_blank');
        } 
    } else {
        console.warn("На экране нет активных или видимых блоков elementBlock.");
    }
}

document.addEventListener('click', (event) => {
    const currentBtn = event.target.closest('.clickfunc, .mclickcfunc');
    const width = window.innerWidth;
    let sizeIsMobile = false;

    if (width < mobileWidth) sizeIsMobile = true;

    if (currentBtn) {
        
        const isMainTabClick = currentBtn.classList.contains('mclickcfunc');

        if (!sizeIsMobile || isMainTabClick) {
            lastCheckedMainTabs.forEach(btn => {
                if (btn) btn.classList.remove("active");
            });
            if (isMainTabClick) lastCheckedMainTabs = []; // Сбрасываем кэш вкладок
        }

        // Одиночные кнопки и внутренние спаны стираем всегда при любом клике
        lastCheckedButtons.forEach(btn => {
            if (btn) btn.classList.remove("active");
        });
        if (lastCheckedU) lastCheckedU.classList.remove("active");
        if (lastCheckedT) lastCheckedT.classList.remove("active");

        lastCheckedU = null;
        lastCheckedT = null;


        // 2. ЛОГИКА ОПРЕДЕЛЕНИЯ И КЭШИРОВАНИЯ АКТИВНЫХ ЭЛЕМЕНТОВ
        if (currentBtn.id === "prjbtn" || currentBtn.id === "prjbtn_mob") {
            const btnWeb = document.getElementById('prjbtn');
            const btnMob = document.getElementById('prjbtn_mob');
            
            // На мобилках сохраняем в отдельный неприкосновенный кэш вкладок
            if (sizeIsMobile) {
                lastCheckedMainTabs = [btnWeb, btnMob].filter(Boolean);
                lastCheckedButtons = []; // Дочерний кэш чист
            } else {
                lastCheckedButtons = [btnWeb, btnMob].filter(Boolean);
            }

            shelfProject.hidden = false;
            shelfScripts.hidden = true;
            
            changeMobileDownloadBtn(true);

        } else if (currentBtn.id === "scrbtn") {
            const btnWeb = document.getElementById('scrbtn');
            
            if (sizeIsMobile) {
                lastCheckedMainTabs = [btnWeb].filter(Boolean);
                lastCheckedButtons = [];
            } else {
                lastCheckedButtons = [btnWeb].filter(Boolean);
            }

            shelfProject.hidden = true;
            shelfScripts.hidden = false;
            
            changeMobileDownloadBtn(false);

        } else if (currentBtn.id === "sepa") {
            if (sizeIsMobile) {
                lastCheckedMainTabs.forEach(btn => btn && btn.classList.remove("active"));
                lastCheckedMainTabs = [];
            }
            lastCheckedButtons = [];
            
        } else {
            // Если кликнули по элементу тулбара (clickfunc), пишем его строго в дочерний кэш
            lastCheckedButtons = [currentBtn];
            lastCheckedU = currentBtn.querySelector('.sel_pre');
            lastCheckedT = currentBtn.querySelector('.sid_tex');
        }

        lastCheckedMainTabs.forEach(btn => btn.classList.add("active"));
        
        // Зажигаем текущие кликнутые элементы и спаны
        lastCheckedButtons.forEach(btn => btn.classList.add("active"));
        if (lastCheckedU) lastCheckedU.classList.add("active");
        if (lastCheckedT) lastCheckedT.classList.add("active");


        // --- ФИЛЬТРАЦИЯ КОНТЕНТА ---
        if (currentBtn.classList.contains('clickfunc')) {
            const target_func = currentBtn.dataset.func;
            document.querySelectorAll('.elementBlock').forEach(block => {
                block.hidden = (block.id !== target_func);
            });
        }

        // 2. Сортировка SCRIPTS
        if (!isMobile && currentBtn.classList.contains('mclickcfunc') && (currentBtn.id === "scrbtn")){
            document.querySelectorAll('.elementBlock').forEach(block => {
                const tag = block.dataset.tag;
                block.hidden = !(tag === "script" || tag === "script_pack");
            });
        }

        // 3. Сортировка PROJECTS
        if (!isMobile && currentBtn.classList.contains('mclickcfunc') && (currentBtn.id === "prjbtn" || currentBtn.id === "prjbtn_mob")){
            document.querySelectorAll('.elementBlock').forEach(block => {
                const tag = block.dataset.tag;
                block.hidden = !(tag === "project" || tag === "project_pack");
            });
        }

        // 4. Сортировка для SEPA (Показать всё, кроме вложенных скриптов)
        if (!isMobile && currentBtn.classList.contains('mclickcfunc') && currentBtn.id === "sepa") {
            document.querySelectorAll('.elementBlock').forEach(block => {
                block.hidden = (block.dataset.tag === "script_inpack");
            });
        }

        hideOverflowingButtons();
    }


    const gifCont = event.target.closest('.gifpreview');
    
    if (!gifCont) return;

    const img = gifCont.querySelector('img');
    let video = gifCont.querySelector('video');
    
    const mediaUrl = img ? img.getAttribute('data-src') : video.getAttribute('src');
    const posterUrl = img ? img.getAttribute('data-poster') : video.getAttribute('poster');
    
    const isVideo = mediaUrl.endsWith('.mp4');

    if (gifCont.classList.contains('playing')) {
        gifCont.classList.remove('playing');
        
        if (isVideo && video) {
            video.pause();
        } else if (img) {
            img.src = posterUrl;
        }
    } else {
        gifCont.classList.add('playing');
        
        if (isVideo) {
            if (!video) {
                video = document.createElement('video');
                video.src = mediaUrl;
                video.poster = posterUrl;
                video.loop = true;
                video.muted = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.preload = 'auto';
                img.remove();
                gifCont.insertBefore(video, gifCont.firstChild);
            }
            video.play().catch(err => console.log("Автоплей заблокирован:", err));
        } else {
            if (img && mediaUrl) {
                img.src = mediaUrl;
            }
        }
    }
});

function resizeGeneral() {

    nowWidth = window.innerWidth;

    isMobileWidth = nowWidth <= mobileWidth ? true : false;

    const sideShelfMobile = document.getElementById('sideShelfMobile');
    
    if(sideShelfMobile){
       sideShelfMobile.hidden = !isMobileWidth; 
    }
     

    const isHighDPI = window.matchMedia(
        '(-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi)'
    ).matches;

    

    if (nowWidth < mobileWidth) { 
        switchToMobile(true);
        transitElements('.about_placeholder_mob', '.about_extend', false);
        
    } else if (nowWidth > 1400) {
        switchToMobile(false);
        transitElements('.about_placeholder_web', '.about_extend', false);

    } else {
        switchToMobile(false);
    }

    if(nowWidth<mobileWidth){
        soloCheck(true);
    }else{
        soloCheck(false);
    }


    if (nowWidth <= mobileWidth) { 
        document.documentElement.style.setProperty('--main_w', '97.5%');
        document.documentElement.style.setProperty('--sidebar_w', `82px`);
        
        
    } else if (nowWidth >= 1400) {
        document.documentElement.style.setProperty('--main_w', '75%');
        document.documentElement.style.setProperty('--sidebar_w', `400px`);

    } else {
        const interpolationFactor = (nowWidth - mobileWidth) / (1400 - mobileWidth);
        const calcWidth = lerp(97.5, 75.0, interpolationFactor);
        const calSidebar = lerp(12.0, 24.0, interpolationFactor);

        document.documentElement.style.setProperty('--main_w', `${calcWidth}%`);
        document.documentElement.style.setProperty('--sidebar_w', `400px`);
        //document.documentElement.style.setProperty('--sidebar_w', `${calSidebar}vw`);
    }

    gifSizeChecker();

    headerTextShorter();
    updateResponsiveText();

    hideOverflowingButtons();

    if(!isMobileWidth){
       updateShortShelf(); 
    }

    //const zagl = document.getElementById('zagl');
    //zagl.classList.add("close"); 
    //zagl.hidden = true;

}


function setActiveHeaderBtn(){

    const scriptBtn = document.getElementById('scrbtn');
    
    if(!scriptBtn) return

    scriptBtn.classList.add('active'); 
    lastCheckedMainTabs = [scriptBtn];

}

function firstStart() {
    resizeGeneral();

    if (isMobile) {

        setActiveHeaderBtn();

        let lastTouchEnd = 0;
        
        document.addEventListener('touchend', function (event) {
            const now = Date.now();
            
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
                
                if (event.target && typeof event.target.click === 'function') {
                    event.target.click();
                }
            }
            lastTouchEnd = now;
        }, { passive: false }); 
    }
}



window.onload = firstStart;
window.addEventListener('resize', resizeGeneral);
