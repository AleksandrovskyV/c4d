<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>template</title>
<script>
   const ua = navigator.userAgent.toLowerCase();
  window.isMobile = /iphone|ipad|android/.test(ua);
  
  if (window.isMobile) {
    document.documentElement.classList.add('mobile');
  }
</script>

<style>
* {margin: 0; padding: 0; box-sizing: border-box; pointer-events: none}

:root {
--main_w: 75%;
--sidebar_w: 200px;
--sidemob_w: 12vw;
--header_h: 162px;
--footer_h: 118px;
--spaces: 5px;
--expand_val: 3.0;

--font_head: 72px;
--font_btn: 32px;
--titlefont: 'title', sans-serif;
--sidefont: 'sidebar', sans-serif;
--monofont: Consolas, "Liberation Mono", Menlo, Courier, monospace;
--name_pr: #767676;
--name_pg: #c8c8ca;
--name_sl: #828282;
--name_us: #424447;

--bgcolor: #2c2f34;
--accolor: #dd9f17;
--accolor_grey: #848484;
}

[hidden] {display: none !important;}

@font-face { font-family: 'title';
src: url('./assets/fonts/GeistMono-SemiBold.ttf') format('truetype'); }

@font-face { font-family: 'sidebar';
src: url('./assets/fonts/GeistMono-Medium.ttf') format('truetype'); }

html, body {
width: 100%;
background-color: var(--bgcolor); 
font-family: sans-serif;
overflow-x: hidden;
overflow-y: auto;
touch-action: manipulation;
}

h2{ 
color: #dfdfe0;
font-family: var(--titlefont);
}

.linePage {
position: fixed; 
left: 0;
right: 0;
margin-left: auto;
margin-right: auto;

width: var(--main_w);
background-color: var(--bgcolor); 
z-index: 6000; 
}

/* Высота в 3 раза больше, чтобы скрыть контент */
#header { 
top: calc(
( var(--header_h) * var(--expand_val) - var(--header_h) )*-1 
);
height: calc( var(--header_h) * var(--expand_val) );

display: flex;
flex-direction: column;
align-items: flex-end;
flex-grow: 0;
}

#footer { 
bottom: calc(var(--footer_h) * -1);
height: calc(var(--footer_h) * 2);
}

#mainPage {
width: var(--main_w);
margin-left: auto;
margin-right: auto;
transform: translateY(calc(var(--header_h) + var(--spaces)));
display: flex; flex-direction: row;
align-items: flex-start; 
margin-bottom: calc(var(--footer_h) * 2);
}

#pearlLine{
font-size: 19px;
margin-top: auto;
transform: translateY(8px);
align-self: flex-start; 
color: var(--name_pr);
}

#headerPage {
display: flex;
flex-direction: row;
width: 100%;
justify-content: space-between;
align-items: flex-end; 
pointer-events: auto;
}


#ContentViewer {
display: flex; 
flex-direction: column;
flex-grow: 1;
margin-top: var(--spaces);
margin-right: calc(var(--spaces)*2);
min-width: 0; 
}

.element {
width: 100%;
margin-bottom: 25px;
min-width: 0; 
}
.element img {
width: 100%;
height: auto;
display: block;
}

#shelfFake {
width: var(--sidebar_w);
min-height: 12px;
height: 100%;
background-color: transparent;
flex-shrink: 0;
background-color: blue;
margin-right: var(--spaces);
}

#mobileShelf {
position: fixed; 
top: calc(var(--header_h) + var(--spaces));
right: calc( ( ( 100% - var(--main_w) ) / 2 ) + var(--spaces) );
width: var(--sidebar_w);
height: calc(100% - var(--header_h) - var(--footer_h) - var(--spaces) * 2);

display: flex;
flex-direction: column;
justify-content: flex-end;
background-color: green;
flex-grow: 0;
}

.mbtn {
aspect-ratio: 1 / 1;
margin-top: var(--spaces);
background-color: var(--bgcolor);
background-size: 80%; 
background-repeat: no-repeat;
background-position: center;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
pointer-events: auto;
background-color: #373c43;
}
.mbtn.text {
background-color: var(--bgcolor);
font-family: var(--titlefont);
font-size: var(--font_btn);
border: 2px solid #7f6423;
color: #dfdfe0;

user-select: none;
line-height: 0;
padding-top: 4px; 
}

.mbtn.top { 
margin-bottom: 12px;
}
.mbtn.bot {
margin-top: 12px;
}
.mbtn.active { 
background-color: var(--accolor_grey);
}
html:not(.mobile) .mbtn:hover {
background-color: var(--accolor);
}

#fpl { background-image: url('./assets/svg/FilledPlane.svg'); }
#mpv { background-image: url('./assets/svg/MP4Vidoc.svg'); }
#swm { background-image: url('./assets/svg/SwapMats.svg'); }
#map { background-image: url('./assets/svg/MatrixPreserve.svg'); }
#ctv { background-image: url('./assets/svg/ObjectColorToVertexColor.svg'); }
#cam { background-image: url('./assets/svg/LinkedCamera.svg'); }

#aws  { background-image: url('./assets/svg/ArnoldWorkflow.svg'); }
#tsm  { background-image: url('./assets/svg/TestSmile_Alt.svg'); }

/* Paste Content */
button {
background: none;
border: 0px solid transparent;
margin: 0;
pointer-events: auto;
}

button:hover {
color: var(--accolor_grey);
}

button.active {
color: var(--accolor);
}

#header button{
font-family: var(--titlefont);
letter-spacing: -0.04em;
font-size: var(--font_head); 
}


.namepageDecor {
font-family: var(--titlefont);
font-size: var(--font_head); 
color: var(--name_pg);
text-align: left;
white-space: nowrap; 
font-kerning: normal; 
letter-spacing: -0.03em;

pointer-events: none;
user-select: none;
}
.headDivider { 
color: var(--name_sl);
}

#namepage_mob { 
color: var(--name_pg);
}
#user_label { 
color: var(--name_us);
}
#user_label:hover{
text-decoration: underline;
cursor: pointer;
}

.base_btn {
font-family: var(--titlefont);
font-size: var(--font_head); 
color: #828282;

text-decoration: none;
pointer-events: auto;
text-align: right;
cursor: pointer;
white-space: nowrap; 
font-kerning: normal; 
letter-spacing: -0.03em;
}

.headerBtn { /* open_btn */
color: #828282;
text-decoration: underline;
cursor: pointer;
}
.headerBtn:not(.active):hover {
filter: brightness(0.85); 
}
.base_btn:not(.active):hover {
filter: brightness(0.85); 
}
.base_btn:active,
.base_btn.active:active {
color: #6d6a65 !important; 
}
.base_btn.active {
color: var(--accolor);
}
.subl {
text-decoration: underline;
}

#tgHeaderFix {
position: fixed; 
left: 0;
top: -18vh;
height: 20vh;
width: 100vw; 
background: var(--bgcolor);
z-index: 500; 
pointer-events: none; 
}



/* Paste Content */

/* Mobile */
@media (max-width: 780px) { 
    :root {
    --main_w: 97.5%;
    --sidebar_w: 82px;
    }

    #user_label:hover{
        text-decoration: none;
        cursor: default;
        pointer-events: none;
    }

    .mob_hide{ display: none !important;
    }
}

/* Web */
@media (min-width: 780px) {

    .web_hide{ display: none !important;
    }
}

@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
  :root {
    --header_h: 100px;
    --footer_h: 100px;
    --spaces: 3px;
    --font_head: 60px;
    --font_btn: 48px !important;
    --sidebar_w: 64px !important;
  }
}
</style>
</head>
<body>

<div id="tgHeaderFix" ></div>

<div id="header" class="linePage">
    <h2 id="pearlLine">* pearl version</h2>

    <div id="headerPage">
          <div id="prebtn">
              <div    id="namepage"     class="namepageDecor mob_hide" tabindex="0"><span id="namepageText">C4D</span> <span class="headDivider">  /</span></div>
              <button id="namepage_mob" class="web_hide">C4D</button>
          </div>

          <button class="headDivider web_hide">/</button>

          <button id="prjbtn_mob"   class="mclickcfunc headerBtn web_hide" data-func="prj_mob"          >PRJ</button>
          <button id="user_label"   class="mclickcfunc"                    data-func="home"             >&amp;</button>
          <div    id="scrbtn"       class="mclickcfunc base_btn "          data-func="scr" tabindex="0" ><span class="headDivider mob_hide">/  </span><span id="scr_text" class="subl">SCRIPTS</span></div>
    </div>
</div>


<div id="mobileShelf" hidden> 
    <div class="mbtn text top" id="switchLangMobile" >RU</div>

    <div id="ms_iconScripts">
        <div class="mbtn" id ="fpl" data-func="filletplane"></div>
        <div class="mbtn" id ="mpv" data-func="mp4vidoc"></div>
        <div class="mbtn" id ="swm" data-func="swap_mats"></div>
        <div class="mbtn" id ="map" data-func="matrix_preserve"></div>
        <div class="mbtn" id ="ctv" data-func="objcolor_to_vercolor"></div>
        <div class="mbtn" id ="cam" data-func="linked_camera"></div>
    </div>
        
    <div id="ms_iconProjects" hidden>
        <div class="mbtn" id ="aws" data-func="ar_wf_string"></div>
        <div class="mbtn" id ="tsm" data-func="test_smile"></div>
    </div>

    <div class="mbtn text bot" id="nextElemBtn">▼</div>
</div>

<div id="mainPage">
    <div id="ContentViewer">
        <div class="element">
            <p>BlaBlaBlas</p>
            <img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png">
        </div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
    </div>
    <div id="shelfFake" ></div>
</div>

<div id="footer" class="linePage"></div>

</div>

<script>
function lerp(start, end, amt) {
    return (1 - amt) * start + amt * end;
}

let translated = false; 
let switchSides = false; 

const mobileWidth = 780+1;
let nowWidth = window.innerWidth;

let isMobileWidth = nowWidth <= mobileWidth ? true : false;

const headerPage = document.getElementById('headerPage');
const pearlLine = document.getElementById('pearlLine');
const namepageText = document.getElementById('namepageText');
const centralText = document.getElementById('user_label');

const scriptBtn   = document.getElementById('scrbtn');
const scriptBtnText = document.getElementById('scr_text');

const mobileShelf = document.getElementById('mobileShelf');


const nameCases = {
    'namepage': ['C4D', 'CINEMA 4D'], 
    'central': ['&','&_DATA','&_USERDATA','VSKY_USERDATA']
};

const reductionOrder = [
  { key: 'namepage', element: namepageText },
  { key: 'central', element: centralText },
];

function textShortChecker() {
  const currentIndices = {
    namepage: nameCases.namepage.length - 1,
    central: nameCases.central.length - 1,
  };

  const updateDOM = () => {
    
    const nowWidth = window.innerWidth;
    
    if (nowWidth >= 960 && nowWidth<1300) {
        namepageText.textContent = "C4D";
        centralText.textContent = "&_DATA";
    }else if (nowWidth < 960){
        namepageText.textContent = "C4D";
        centralText.textContent = "&";
    }else{
        namepageText.textContent = nameCases.namepage[currentIndices.namepage];
        centralText.textContent = "\u00A0" + nameCases.central[currentIndices.central] + "\u00A0";
    }

    if(namepageText.textContent==="C4D"){
        pearlLine.textContent = "* pearl";
    }else{
        pearlLine.textContent = "* pearl edition";
    }

    if(nowWidth<mobileWidth*.7){
        if(scriptBtnText){ 
            scriptBtnText.textContent = "SCR" + "\u00A0";
        }
    }else{
        if(scriptBtnText){ 
            scriptBtnText.textContent = "SCRIPTS";
        }   
    }

  };
    
  updateDOM();

  const isOverflowing = () => {
    return headerPage.scrollWidth > headerPage.clientWidth;
  };
  let step = 0;
  
  while (isOverflowing() && step < reductionOrder.length) {
    const currentTarget = reductionOrder[step];
    
    if (currentIndices[currentTarget.key] > 0) {
      currentIndices[currentTarget.key]--;
      updateDOM();
    } else {
      step++;
    }
  }
}

function updateResponsiveText() {
    const nowWidth = window.innerWidth;
    const langPrefix = translated ? 'ru' : 'us';

    document.querySelectorAll('.lngsup').forEach(texblock => {
        if (texblock.id === 'swapside' || texblock.id === 'swapside_mobile') return;
        let text = '';
        
        if (nowWidth <= 1000) {
            text = texblock.dataset[`${langPrefix}Short` ] || texblock.dataset[`${langPrefix}Mid`];
        } else if (nowWidth > 1000 && nowWidth <= 1400) {
            text = texblock.dataset[`${langPrefix}Mid`];
        } else if (nowWidth > 1400 && nowWidth <= 1700) {
            text = texblock.dataset[`${langPrefix}Mid` ];
        }

        if (!text) {
            text = texblock.dataset[langPrefix];
        }

        if (text) {
            texblock.textContent = text;
        }
    });
}

function updateShortShelf() {
     // Сверх мелкий грид
    const shelf = document.getElementById('shortshelf');
    if (!shelf) return;

    const width = window.innerWidth;
    const height = window.innerHeight;
    const isMobileLayout = document.documentElement.classList.contains('mobile');

    if (width < 600 && height < 600 && !isMobileLayout) {

        shelf.hidden = false;
        shortShelfActive =true;

        const buttons = shelf.querySelectorAll('.mt_btn');
        const count = buttons.length;

        const cols = Math.ceil(Math.sqrt(count)); 
        shelf.style.setProperty('--cols', cols);

    } else {
        shelf.setAttribute('hidden', '');
        shelf.style.removeProperty('display');
        shelf.hidden = true;
        shortShelfActive =false;
    }
}


function resizeGeneral() {

    nowWidth = window.innerWidth;

    isMobileWidth = nowWidth <= mobileWidth ? true : false;
    mobileShelf.hidden = !isMobileWidth; 

    const isHighDPI = window.matchMedia(
        '(-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi)'
    ).matches;

    
    if (nowWidth <= mobileWidth) { 
        document.documentElement.style.setProperty('--main_w', '97.5%');
        document.documentElement.style.setProperty('--sidebar_w', `82px`);
        
        
    } else if (nowWidth >= 1400) {
        document.documentElement.style.setProperty('--main_w', '75%');
        document.documentElement.style.setProperty('--sidebar_w', `400px`);

    } else {
        const interpolationFactor = (nowWidth - mobileWidth) / (1400 - mobileWidth);
        const calcWidth = lerp(97.5, 75.0, interpolationFactor);
        const calSidebar = lerp(12.0, 24.0, interpolationFactor);

        document.documentElement.style.setProperty('--main_w', `${calcWidth}%`);
        document.documentElement.style.setProperty('--sidebar_w', `400px`);
        //document.documentElement.style.setProperty('--sidebar_w', `${calSidebar}vw`);
    }

    //gifSizeChecker();

    textShortChecker();
    updateResponsiveText();

    if(!isMobileWidth){
       updateShortShelf(); 
    }
}


function setActiveHeaderBtn(){
    if(!scriptBtn) return

    scriptBtn.classList.add('active'); 
    lastCheckedMainTabs = [scriptBtn];

}

function firstStart() {
    resizeGeneral();

    if(isMobile) setActiveHeaderBtn();

}

window.onload = firstStart;
window.addEventListener('resize', resizeGeneral);

</script>

</body>
</html>
