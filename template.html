<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>template</title>
<script>
   const ua = navigator.userAgent.toLowerCase();
  window.isMobile = /iphone|ipad|android/.test(ua);
  
  if (window.isMobile) {
    document.documentElement.classList.add('mobile');
  }
</script>

<style>
* {margin: 0; padding: 0; box-sizing: border-box;}

:root {
--main_w: 75vw;
--iconbar_w: 12vw;
--bars_h: 12vh;
--spaces: 5px;
--bgcolor: #2c2f34;
}

[hidden] {display: none !important;}

html, body {
width: 100%;
background-color: var(--bgcolor); 
font-family: sans-serif;
overflow-x: hidden;
overflow-y: auto;
}

.linePage{
position: fixed; 
Left: calc((100vw - var(--main_w)) / 2);
width: var(--main_w);
height: calc(var(--bars_h) * 2);
background-color: red; 
z-index: 9999; 
}

#header { top: calc(var(--bars_h) * -1);
}

#footer { bottom: calc(var(--bars_h) * -1);
}

#middlePage {
width: var(--main_w);
Left: calc((100vw - var(--main_w)) / 2);
transform: translateX(calc((100vw - var(--main_w)) / 2)) translateY(calc(var(--bars_h) + var(--spaces)));
display: flex; flex-direction: row;
align-items: flex-start; 
margin-bottom: calc(var(--bars_h) * 2);
}

#ContentViewer {
display: flex; flex-direction: column;
flex-grow: 1;
margin: var(--spaces);
}

#iconsColumnFake {
width: var(--iconbar_w);
height: 100%;
background-color: transparent;
flex-shrink: 0; 
}

#iconsColumn {
position: fixed; 
top: calc(var(--bars_h) + var(--spaces));
height: calc(100vh - var(--bars_h) * 2 - var(--spaces) * 2);
width: var(--iconbar_w);
left: calc(((100vw - var(--main_w)) / 2) + var(--main_w) - var(--iconbar_w));

display: flex;
flex-direction: column;
justify-content: flex-end;
background-color: green;
z-index: 9000;
}

.element {
width: 100%;
margin-bottom: 25px;
background-color: green;
}
.element img {
width: 100%;
height: auto;
display: block;
}

.mbtn {
aspect-ratio: 1 / 1;
margin-top: var(--spaces);
background-color: #373c43;
background-size: auto; 
background-repeat: no-repeat;
background-position: center;
}

#fp { background-image: url('./assets/svg/FilledPlane.svg'); }

</style>
</head>
<body>

<div id="header" class="linePage"></div>

<div id="iconsColumn"> 
    <div id ="fp" class="mbtn"></div>
    <div id ="fp" class="mbtn"></div>
    <div id ="fp" class="mbtn"></div>
    <div id ="fp" class="mbtn"></div>
</div>

<div id="middlePage">
    <div id="ContentViewer">
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
        <div class="element"><img src="https://vsky.space/c4d/assets/prvgif/helpers_poster.png"></div>
    </div>
    <div id="iconsColumnFake"></div>
</div>

<div id="footer" class="linePage"></div>

</div>

</body>
</html>
